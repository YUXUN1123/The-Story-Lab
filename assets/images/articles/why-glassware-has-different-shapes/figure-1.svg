<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 背景紙質質感 -->
    <linearGradient id="figBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#493A34" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 全圖底色板 -->
  <rect width="1020" height="540" fill="url(#figBgGrad)"/>

  <!-- 圖表總刊頭區（Header Zone） -->
  <g transform="translate(45, 36)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#69745C" font-weight="700">TECHNICAL SPECIFICATION // SENSORY GLASSWARE</text>
    <text x="0" y="24" font-family="'Noto Serif TC', serif" font-size="18" font-weight="700" fill="#292927">FIGURE A &amp; B · 玻璃杯流體力學與四大經典器型機能矩陣</text>
    <line x1="0" y1="36" x2="930" y2="36" stroke="#E2DDD3" stroke-width="1.2"/>
  </g>

  <!-- ====================================================================
       左卡：FIGURE A · 流體力學與香氣氣室 (AERODYNAMIC ANATOMY)
       幾何：x=45, y=90, width=445, height=425
       ==================================================================== -->
  <g transform="translate(45, 90)">
    <!-- 卡片外框底板 -->
    <rect width="445" height="425" rx="3" fill="#FFFFFF" stroke="#E2DDD3" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="445" height="32" rx="2" fill="#FAF7F2" stroke="#E2DDD3" stroke-width="1"/>
    <text x="16" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#292927">FIGURE A · 杯體剖面與流體香氣氣室</text>

    <!-- 幾何杯體剖面圖 (中心約 x=105, y=165) -->
    <g transform="translate(105, 45)">
      <!-- 參考中心軸線 -->
      <line x1="0" y1="12" x2="0" y2="245" stroke="#655348" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.3"/>

      <!-- 杯身輪廓剖面 -->
      <path d="M-40,22 C-68,85 -62,155 0,185 C62,155 68,85 40,22 Z" fill="#F9F6F0" stroke="#292927" stroke-width="1.8"/>
      <!-- 液面弧線與底酒 -->
      <path d="M-58,125 Q0,138 58,125" fill="none" stroke="#8E2927" stroke-width="1.5"/>
      <path d="M-58,125 Q0,138 58,125 C54,160 36,180 0,185 C-36,180 -54,160 -58,125 Z" fill="#8E2927" fill-opacity="0.12"/>

      <!-- 香氣向上聚攏渦流虛線 -->
      <path d="M-26,115 Q-35,70 -16,36" fill="none" stroke="#69745C" stroke-width="1.2" stroke-dasharray="3,2"/>
      <path d="M26,115 Q35,70 16,36" fill="none" stroke="#69745C" stroke-width="1.2" stroke-dasharray="3,2"/>
      <polygon points="-16,34 -21,41 -11,41" fill="#69745C"/>
      <polygon points="16,34 11,41 21,41" fill="#69745C"/>

      <!-- 杯梗與基座 -->
      <line x1="0" y1="185" x2="0" y2="248" stroke="#292927" stroke-width="2.4"/>
      <ellipse cx="0" cy="248" rx="38" ry="6" fill="#FAF7F2" stroke="#292927" stroke-width="1.4"/>
    </g>

    <!-- 右側標籤指示區（Labels Zone）- X 起點 196 -->
    <g transform="translate(196, 52)">
      <!-- 標籤 1：杯口縮口 -->
      <g transform="translate(0, 10)">
        <polyline points="-48,6 -12,6 0,6" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-48" cy="6" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">杯口縮口 (Inward Rim)</text>
        <text x="8" y="20" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">聚攏逸散分子，減緩酒精刺激</text>
      </g>

      <!-- 標籤 2：香氣氣室 -->
      <g transform="translate(0, 70)">
        <polyline points="-64,6 -12,6 0,6" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-64" cy="6" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">氣相空間 (Headspace)</text>
        <text x="8" y="20" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">芳香化合物揮發與飽和空間</text>
      </g>

      <!-- 標籤 3：呼吸液面 -->
      <g transform="translate(0, 130)">
        <polyline points="-28,6 -12,6 0,6" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-28" cy="6" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">氧化液面 (Contact Surface)</text>
        <text x="8" y="20" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">寬廣杯腹促成充沛氧氣接觸</text>
      </g>

      <!-- 標籤 4：隔熱杯梗 -->
      <g transform="translate(0, 190)">
        <polyline points="-88,6 -12,6 0,6" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-88" cy="6" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">細長杯梗 (Thermal Stem)</text>
        <text x="8" y="20" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">隔絕手掌 36°C 體溫直接傳導</text>
      </g>
    </g>

    <!-- 底部原理說明盒（Explanatory Box） -->
    <rect x="16" y="320" width="413" height="88" rx="2" fill="#F8F5EE" stroke="#EAE4D8" stroke-width="1"/>
    <text x="24" y="344" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#574448">
      <tspan x="24" dy="0">【流體動力機制】酒液旋轉時，離心力促使液體在杯壁</tspan>
      <tspan x="24" dy="21">形成微米級薄膜，大幅增加揮發表面積；內縮杯口調控</tspan>
      <tspan x="24" dy="21">鼻腔吸入濃度，使輕盈果香與醇厚底香達到動態平衡。</tspan>
    </text>
  </g>

  <!-- ====================================================================
       右卡：FIGURE B · 四大經典器型與感官機能矩陣 (FOUR ARCHETYPES)
       幾何：x=515, y=90, width=460, height=425
       ==================================================================== -->
  <g transform="translate(515, 90)">
    <!-- 卡片外框底板 -->
    <rect width="460" height="425" rx="3" fill="#FFFFFF" stroke="#E2DDD3" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="460" height="32" rx="2" fill="#FAF7F2" stroke="#E2DDD3" stroke-width="1"/>
    <text x="16" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#292927">FIGURE B · 四大經典器型與感官機能對照</text>

    <!-- 4 個條目橫列（各高 60px，間距充足） -->
    <g transform="translate(16, 42)">
      
      <!-- 條目 1：勃艮第寬肚杯 -->
      <g transform="translate(0, 0)">
        <rect width="428" height="60" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <g transform="translate(14, 18)">
          <circle cx="12" cy="12" r="12" fill="#F3EBDD" stroke="#8E2927" stroke-width="1.2"/>
          <text x="12" y="16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#8E2927">01</text>
        </g>
        <g transform="translate(54, 6)">
          <text x="0" y="16" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">勃艮第球型杯 (Burgundy Balloon)</text>
          <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">超大氣室收集低沸點花果香，引導酒液直落舌心感受甜潤。</text>
        </g>
      </g>

      <!-- 條目 2：波爾多鬱金香杯 -->
      <g transform="translate(0, 68)">
        <rect width="428" height="60" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <g transform="translate(14, 18)">
          <circle cx="12" cy="12" r="12" fill="#F3EBDD" stroke="#655348" stroke-width="1.2"/>
          <text x="12" y="16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#655348">02</text>
        </g>
        <g transform="translate(54, 6)">
          <text x="0" y="16" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">波爾多鬱金香杯 (Bordeaux Tulip)</text>
          <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">高縱深直壁減緩酒精衝擊，迫使仰角飲用，平滑柔化單寧。</text>
        </g>
      </g>

      <!-- 條目 3：香檳笛型杯 -->
      <g transform="translate(0, 136)">
        <rect width="428" height="60" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <g transform="translate(14, 18)">
          <circle cx="12" cy="12" r="12" fill="#F3EBDD" stroke="#69745C" stroke-width="1.2"/>
          <text x="12" y="16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#69745C">03</text>
        </g>
        <g transform="translate(54, 6)">
          <text x="0" y="16" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">香檳笛型杯 (Champagne Flute)</text>
          <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">狹窄表面延緩碳酸逸散，底端微蝕成核點形成垂直升騰氣泡。</text>
        </g>
      </g>

      <!-- 條目 4：古典岩石杯 -->
      <g transform="translate(0, 204)">
        <rect width="428" height="60" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <g transform="translate(14, 18)">
          <circle cx="12" cy="12" r="12" fill="#F3EBDD" stroke="#C2A26F" stroke-width="1.2"/>
          <text x="12" y="16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#C2A26F">04</text>
        </g>
        <g transform="translate(54, 6)">
          <text x="0" y="16" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">古典平底岩石杯 (Old Fashioned / Tumbler)</text>
          <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">廣口加速高酒精刺鼻感揮發，厚實杯底承載老冰塊融降釋香。</text>
        </g>
      </g>
    </g>

    <!-- 底部總結盒 -->
    <rect x="16" y="320" width="428" height="88" rx="2" fill="#FAF7F0" stroke="#E8E1D5" stroke-width="1"/>
    <text x="24" y="344" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#493A34">
      <tspan x="24" dy="0">【造物哲學總結】杯型絕非裝飾，而是精密控制「流速、</tspan>
      <tspan x="24" dy="21">入嘴落點、揮發氣相濃度與溫度傳導」的物理流體調音器。</tspan>
      <tspan x="24" dy="21">適器適飲，正是人類將感官生理學注入日常器皿的最高工藝體現。</tspan>
    </text>
  </g>
</svg>
