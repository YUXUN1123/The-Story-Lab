<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 背景紙質質感 -->
    <linearGradient id="figBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#493A34" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 全圖底色板 -->
  <rect width="1020" height="540" fill="url(#figBgGrad)"/>

  <!-- 圖表總刊頭區（Header Zone） -->
  <g transform="translate(45, 38)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#69745C" font-weight="700">TECHNICAL SPECIFICATION // SENSORY GLASSWARE</text>
    <text x="0" y="24" font-family="'Noto Serif TC', serif" font-size="18" font-weight="700" fill="#292927">FIGURE A &amp; B · 玻璃杯流體力學與四大經典器型機能矩陣</text>
    <line x1="0" y1="36" x2="930" y2="36" stroke="#E2DDD3" stroke-width="1.2"/>
  </g>

  <!-- ====================================================================
       左卡：FIGURE A · 流體力學與香氣氣室 (AERODYNAMIC ANATOMY)
       幾何：x=45, y=95, width=445, height=420
       ==================================================================== -->
  <g transform="translate(45, 95)">
    <!-- 卡片外框底板 -->
    <rect width="445" height="420" rx="2" fill="#FFFFFF" stroke="#E2DDD3" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="445" height="32" fill="#FAF7F2" stroke="#E2DDD3" stroke-width="1"/>
    <text x="16" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#292927">FIGURE A · 杯體剖面與流體香氣氣室</text>

    <!-- 幾何杯體剖面圖 (中心約 x=150, y=180) -->
    <g transform="translate(130, 48)">
      <!-- 參考中心軸線 -->
      <line x1="0" y1="15" x2="0" y2="250" stroke="#655348" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.35"/>

      <!-- 杯身輪廓剖面 -->
      <path d="M-45,25 C-75,90 -70,165 0,195 C70,165 75,90 45,25 Z" fill="#F9F6F0" stroke="#292927" stroke-width="1.8"/>
      <!-- 液面弧線 -->
      <path d="M-65,130 Q0,145 65,130" fill="none" stroke="#8E2927" stroke-width="1.5"/>
      <path d="M-65,130 Q0,145 65,130 C60,170 40,190 0,195 C-40,190 -60,170 -65,130 Z" fill="#8E2927" fill-opacity="0.12"/>

      <!-- 香氣向上聚攏渦流虛線 -->
      <path d="M-30,120 Q-40,75 -20,40" fill="none" stroke="#69745C" stroke-width="1.2" stroke-dasharray="3,2"/>
      <path d="M30,120 Q40,75 20,40" fill="none" stroke="#69745C" stroke-width="1.2" stroke-dasharray="3,2"/>
      <polygon points="-20,38 -25,45 -15,45" fill="#69745C"/>
      <polygon points="20,38 15,45 25,45" fill="#69745C"/>

      <!-- 杯梗與基座 -->
      <line x1="0" y1="195" x2="0" y2="255" stroke="#292927" stroke-width="2.5"/>
      <ellipse cx="0" cy="255" rx="42" ry="6" fill="#FAF7F2" stroke="#292927" stroke-width="1.4"/>
    </g>

    <!-- 右側標籤指示區（Labels Zone）- X 起點 220，安全邊距充足 -->
    <g transform="translate(225, 68)">
      <!-- 標籤 1：杯口縮口 -->
      <g transform="translate(0, 0)">
        <polyline points="-50,5 -15,5 0,5" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-50" cy="5" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">杯口縮口 (Inward Rim)</text>
        <text x="8" y="16" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">聚攏逸散分子，減緩酒精刺激</text>
      </g>

      <!-- 標籤 2：香氣氣室 -->
      <g transform="translate(0, 48)">
        <polyline points="-60,5 -15,5 0,5" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-60" cy="5" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">氣相空間 (Headspace)</text>
        <text x="8" y="16" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">芳香化合物揮發與飽和空間</text>
      </g>

      <!-- 標籤 3：呼吸液面 -->
      <g transform="translate(0, 96)">
        <polyline points="-30,5 -15,5 0,5" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-30" cy="5" r="2.5" fill="#C2A26F"/>
        <text x="8" y="0" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">氧化液面 (Contact Surface)</text>
        <text x="8" y="16" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">寬杯腹提供充沛氧氣接觸</text>
      </g>

      <!-- 標籤 4：隔熱杯梗 -->
      <g transform="translate(0, 144)">
        <polyline points="-95,15 -15,15 0,15" fill="none" stroke="#C2A26F" stroke-width="1"/>
        <circle cx="-95" cy="15" r="2.5" fill="#C2A26F"/>
        <text x="8" y="10" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">細長杯梗 (Thermal Stem)</text>
        <text x="8" y="26" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#7E6B6E">隔絕手掌 36°C 體溫直接傳導</text>
      </g>
    </g>

    <!-- 底部原理說明盒（Explanatory Box） -->
    <rect x="16" y="325" width="413" height="78" rx="2" fill="#F8F5EE" stroke="#EAE4D8" stroke-width="1"/>
    <text x="28" y="347" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#574448">
      <tspan x="28" dy="0">【流體動力機制】當酒液注入杯中旋轉時，離心力將液體鋪展在</tspan>
      <tspan x="28" dy="20">杯壁薄膜上，大幅提高揮發表面積；倒梯形縮口則精準控制鼻腔</tspan>
      <tspan x="28" dy="20">吸入濃度，使輕盈酯類香氣與醇厚底香達到動態平衡。</tspan>
    </text>
  </g>

  <!-- ====================================================================
       右卡：FIGURE B · 四大經典器型與感官機能矩陣 (FOUR ARCHETYPES)
       幾何：x=515, y=95, width=460, height=420
       ==================================================================== -->
  <g transform="translate(515, 95)">
    <!-- 卡片外框底板 -->
    <rect width="460" height="420" rx="2" fill="#FFFFFF" stroke="#E2DDD3" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="460" height="32" fill="#FAF7F2" stroke="#E2DDD3" stroke-width="1"/>
    <text x="16" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#292927">FIGURE B · 四大經典器型與感官機能對照</text>

    <!-- 4 個條目橫列（垂直間距均勻為 64px） -->
    <g transform="translate(16, 42)">
      
      <!-- 條目 1：勃艮第寬肚杯 -->
      <g transform="translate(0, 0)">
        <rect width="428" height="56" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <circle cx="28" cy="28" r="14" fill="#F3EBDD" stroke="#8E2927" stroke-width="1.2"/>
        <text x="28" y="33" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#8E2927">01</text>
        <text x="52" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">勃艮第球型杯 (Burgundy Balloon)</text>
        <text x="52" y="42" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">
          <tspan>超大氣室收集低沸點花果香，引導酒液直落舌頭中央感受甜潤。</tspan>
        </text>
      </g>

      <!-- 條目 2：波爾多鬱金香杯 -->
      <g transform="translate(0, 66)">
        <rect width="428" height="56" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <circle cx="28" cy="28" r="14" fill="#F3EBDD" stroke="#655348" stroke-width="1.2"/>
        <text x="28" y="33" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#655348">02</text>
        <text x="52" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">波爾多鬱金香杯 (Bordeaux Tulip)</text>
        <text x="52" y="42" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">
          <tspan>高縱深直壁減緩酒精衝擊，迫使仰角飲用，平滑過濾強烈單寧。</tspan>
        </text>
      </g>

      <!-- 條目 3：香檳笛型杯 -->
      <g transform="translate(0, 132)">
        <rect width="428" height="56" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <circle cx="28" cy="28" r="14" fill="#F3EBDD" stroke="#69745C" stroke-width="1.2"/>
        <text x="28" y="33" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#69745C">03</text>
        <text x="52" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">香檳笛型杯 (Champagne Flute)</text>
        <text x="52" y="42" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">
          <tspan>狹窄表面延緩碳酸逸散，底端雷射微蝕成核點形成持續升騰氣泡。</tspan>
        </text>
      </g>

      <!-- 條目 4：古典岩石杯 -->
      <g transform="translate(0, 198)">
        <rect width="428" height="56" rx="2" fill="#FAF8F5" stroke="#EFE9DF" stroke-width="1"/>
        <circle cx="28" cy="28" r="14" fill="#F3EBDD" stroke="#C2A26F" stroke-width="1.2"/>
        <text x="28" y="33" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="700" fill="#C2A26F">04</text>
        <text x="52" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#292927">古典平底岩石杯 (Old Fashioned / Tumbler)</text>
        <text x="52" y="42" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#655348">
          <tspan>廣口加速高酒精刺鼻感揮發，厚實杯底承載冰球撞擊與持握手溫。</tspan>
        </text>
      </g>
    </g>

    <!-- 底部總結盒 -->
    <rect x="16" y="325" width="428" height="78" rx="2" fill="#FAF7F0" stroke="#E8E1D5" stroke-width="1"/>
    <text x="28" y="348" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#493A34">
      <tspan x="28" dy="0">【造物哲學總結】杯型絕非盲目的美學裝飾，而是精密控制「流速、</tspan>
      <tspan x="28" dy="20">入嘴落點、揮發氣相濃度與溫度傳導」的物理流體調音器。</tspan>
      <tspan x="28" dy="20">適器適飲，正是人類將感官生理學注入日常器皿的最高工藝體現。</tspan>
    </text>
  </g>
</svg>
