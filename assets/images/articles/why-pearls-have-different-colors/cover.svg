<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 背景深邃珠寶緞面漸層 -->
    <linearGradient id="pearlDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1820"/>
      <stop offset="50%" stop-color="#2D2836"/>
      <stop offset="100%" stop-color="#16141B"/>
    </linearGradient>

    <!-- 珍珠虹彩暈彩光暈（Thin-film Interference Glow） -->
    <radialGradient id="orientGlow" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#E2F0EC"/>
      <stop offset="75%" stop-color="#ECDDF3"/>
      <stop offset="90%" stop-color="#D7BA9D"/>
      <stop offset="100%" stop-color="#8E7A8A"/>
    </radialGradient>

    <!-- 母貝貝殼紋理漸層 -->
    <linearGradient id="shellNacre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#544855"/>
      <stop offset="30%" stop-color="#7B6D7D"/>
      <stop offset="70%" stop-color="#9C8B9E"/>
      <stop offset="100%" stop-color="#4E3E4F"/>
    </linearGradient>

    <!-- 光學反射高光點 -->
    <radialGradient id="highlightGlow" cx="40%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="url(#pearlDarkBg)"/>

  <!-- 母貝貝殼扇形輪廓（母貝底座） -->
  <g transform="translate(600, 480)" opacity="0.6">
    <!-- 外殼扇紋 -->
    <path d="M -380 -80 C -340 -200, -180 -270, 0 -280 C 180 -270, 340 -200, 380 -80 C 350 40, 200 120, 0 130 C -200 120, -350 40, -380 -80 Z" 
          fill="url(#shellNacre)" stroke="#897589" stroke-width="2"/>
    
    <!-- 貝殼內部波浪狀生長線 -->
    <path d="M -300 -60 C -260 -160, -140 -210, 0 -220 C 140 -210, 260 -160, 300 -60" fill="none" stroke="#D3C3D4" stroke-width="1.5" opacity="0.4"/>
    <path d="M -220 -40 C -180 -120, -100 -160, 0 -170 C 100 -160, 180 -120, 220 -40" fill="none" stroke="#D3C3D4" stroke-width="1.2" opacity="0.4"/>
    <path d="M -140 -20 C -100 -80, -60 -110, 0 -115 C 60 -110, 100 -80, 140 -20" fill="none" stroke="#D3C3D4" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 中心巨大珍珠主體（象徵圓潤、光澤與光學暈彩） -->
  <g transform="translate(600, 340)">
    <!-- 珍珠底部陰影 -->
    <ellipse cx="0" cy="140" rx="150" ry="25" fill="#0C0A0E" opacity="0.7"/>

    <!-- 珍珠球體 -->
    <circle cx="0" cy="0" r="145" fill="url(#orientGlow)" stroke="#F8EEF8" stroke-width="1"/>

    <!-- 伴色光環 (Overtone Tint: 淡淡玫瑰粉與孔雀綠環繞邊界) -->
    <circle cx="0" cy="0" r="144" fill="none" stroke="#F5C4CD" stroke-width="8" opacity="0.35"/>
    <circle cx="0" cy="0" r="142" fill="none" stroke="#BCE3D8" stroke-width="12" opacity="0.25"/>

    <!-- 鏡面高光（Reflection Highlight） -->
    <ellipse cx="-45" cy="-55" rx="35" ry="25" transform="rotate(-25 -45 -55)" fill="url(#highlightGlow)"/>
    <circle cx="-50" cy="-60" r="10" fill="#FFFFFF"/>
    <!-- 次高光（底部透光感） -->
    <path d="M -70 90 Q 0 135 70 90" stroke="#FFF7ED" stroke-width="4" fill="none" opacity="0.4"/>
  </g>

  <!-- 散落的微小珍珠（象徵多樣體色：黑珍珠、金珠、白珠） -->
  <!-- 大溪地黑珍珠 -->
  <g transform="translate(320, 440)">
    <circle cx="0" cy="0" r="35" fill="#2B3033" stroke="#4F585C" stroke-width="1"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#5E8B7E" stroke-width="3" opacity="0.5"/>
    <circle cx="-10" cy="-12" r="5" fill="#FFFFFF" opacity="0.7"/>
    <text x="0" y="55" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#A8BAC2" text-anchor="middle">Tahitian (孔雀綠暈彩)</text>
  </g>

  <!-- 南洋金珠 -->
  <g transform="translate(880, 440)">
    <circle cx="0" cy="0" r="38" fill="#DDB158" stroke="#F4D38A" stroke-width="1"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="#FFE9A3" stroke-width="4" opacity="0.6"/>
    <circle cx="-12" cy="-14" r="5" fill="#FFFFFF" opacity="0.8"/>
    <text x="0" y="58" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#E6D097" text-anchor="middle">South Sea (黃金體色)</text>
  </g>

  <!-- 標題與知識維度文字 -->
  <g font-family="'Cormorant Garamond', 'Noto Serif TC', serif" fill="#F4EAE1">
    <text x="80" y="90" font-size="14" letter-spacing="4" opacity="0.8">OPTICAL INTERFERENCE &amp; GEMOLOGY</text>
    <text x="80" y="125" font-size="28" font-weight="600" letter-spacing="2">珍珠的色彩光譜：文石疊層與薄膜干涉</text>
    <text x="80" y="150" font-size="13" font-family="'Noto Sans TC', sans-serif" letter-spacing="1" opacity="0.7">Bodycolor (底色) · Overtone (伴色) · Orient (結構暈彩)</text>
  </g>

  <!-- 右下角珠寶學權威標示 -->
  <g font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#C5B5C7" opacity="0.6" text-anchor="end">
    <text x="1120" y="600">GIA Gemological Classification Standards</text>
    <text x="1120" y="620">THE STORY LAB · Everyday Mysteries Archive</text>
  </g>
</svg>